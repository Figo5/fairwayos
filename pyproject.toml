[project]
name = "fairwayos"
version = "0.1.0"
description = "FairwayOS local-first golf shot-analytics and video-perception research platform. Synthetic data only."
# 3.11, not 3.9: the suite needs cv2, and ~100 tests error out at collection on
# 3.9 with ModuleNotFoundError. The old floor made a fresh checkout look broken.
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
